project:
  title: "Mengrui's progect"
  author: "BarryLee911"
  discord: ""
  description: "Counts ADC sign matches against a square reference over a 1600-sample sliding window."
  language: "Verilog"
  clock_hz: 80000000
  # Initial area target; the implementation reports determine whether this fits.
  tiles: "1x1"
  top_module: "tt_um_sine_area_detector"
  source_files:
    - "project.v"

pinout:
  ui[0]: "ADC_D0"
  ui[1]: "ADC_D1"
  ui[2]: "ADC_D2"
  ui[3]: "ADC_D3"
  ui[4]: "ADC_D4"
  ui[5]: "ADC_D5"
  ui[6]: "ADC_D6"
  ui[7]: "ADC_D7"
  uo[0]: "OVERLAP_COUNT[0]"
  uo[1]: "OVERLAP_COUNT[1]"
  uo[2]: "OVERLAP_COUNT[2]"
  uo[3]: "OVERLAP_COUNT[3]"
  uo[4]: "OVERLAP_COUNT[4]"
  uo[5]: "OVERLAP_COUNT[5]"
  uo[6]: "OVERLAP_COUNT[6]"
  uo[7]: "OVERLAP_COUNT[7]"
  uio[0]: "FREQ_EXPONENT[0] (input)"
  uio[1]: "FREQ_EXPONENT[1] (input)"
  uio[2]: "FREQ_EXPONENT[2] (input)"
  uio[3]: "FREQ_EXPONENT[3] (input)"
  uio[4]: "FREQ_EXPONENT[4] (input)"
  uio[5]: "OVERLAP_COUNT[8] (output)"
  uio[6]: "OVERLAP_COUNT[9] (output)"
  uio[7]: "OVERLAP_COUNT[10] (output)"

yaml_version: 6
